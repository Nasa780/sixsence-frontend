# Vérification automatique de chaque PR et de chaque commit sur main :
# le site doit s'installer et se construire sans erreur.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construction du site
        run: npm run build
